# Storage services for Member 2's production backends, for local development and tests.
#
#   docker compose -f deploy/storage.compose.yml up -d      # PostgreSQL + pgvector on 5432, MinIO on 9000 (console 9001)
#   docker compose -f deploy/storage.compose.yml down -v    # stop and delete the data
#
# Then point the servers at them (see README.md, "Storage backends"):
#   CLAIMCLEAR_CASE_INDEX=postgresql://claimclear:claimclear@127.0.0.1:5432/claimclear
#   CLAIMCLEAR_BLOB_STORE=s3://claimclear-documents?endpoint=127.0.0.1:9000&secure=0
#   CLAIMCLEAR_S3_ACCESS_KEY=claimclear  CLAIMCLEAR_S3_SECRET_KEY=claimclear-secret
#   CLAIMCLEAR_MEMORY_DB=postgresql://claimclear:claimclear@127.0.0.1:5432/claimclear
#   CLAIMCLEAR_POLICY_KB_VECTORS=postgresql://claimclear:claimclear@127.0.0.1:5432/claimclear
#
# Development credentials only: change them (and keep them in .env) anywhere else.
# Member 4's full docker-compose for the app adds these two services beside the servers.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: claimclear
      POSTGRES_PASSWORD: claimclear
      POSTGRES_DB: claimclear
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimclear -d claimclear"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    # MinIO no longer publishes community images on Docker Hub or quay.io; Chainguard's free build is MinIO
    # itself, pinned by digest. It has no shell, so there is no healthcheck: clients retry until it answers.
    image: cgr.dev/chainguard/minio@sha256:786cb11d340b1a657de8dc899560e36e1d1fb371d3d6f3eb6c903a0bb0cec714
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: claimclear
      MINIO_ROOT_PASSWORD: claimclear-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
