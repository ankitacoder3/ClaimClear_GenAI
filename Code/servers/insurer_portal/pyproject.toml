[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claimclear-insurer-portal"
version = "0.1.0"
description = "ClaimClear insurer-portal MCP server: the file_grievance / grievance_status interface with a dry-run backend (Member 4 adds the mock portal)."
requires-python = ">=3.10"
dependencies = ["mcp==2.3.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["insurer_portal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
