[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claimclear-graph"
version = "0.4.0"
description = "ClaimClear multi-agent orchestration (Member 3): the LangGraph supervisor graph that drives Member 2's MCP servers through claimclear_tools, with a critic loop, replanning, memory and a human approval gate."
requires-python = ">=3.10"
dependencies = [
    "claimclear-contracts",          # ../../contracts: CaseState, Plan, CriticReport, ExplainerDraft, GrievanceDraft
    "claimclear-tools",              # ../toolkit: ClaimClearToolkit, signals, case, critic, agents
    "claimclear-memory",             # ../../memory: per-user long-term memory (optional at run time)
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3",  # durable checkpoints (claimclear_graph.checkpoints)
    "langchain-core>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "pytest-randomly>=3"]

[tool.setuptools.packages.find]
include = ["claimclear_graph*"]

[tool.setuptools.package-data]
"claimclear_graph.webapp" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# CI: python -m pytest --cov=claimclear_graph --cov-branch --cov-fail-under=95   (tests run in random order)
pythonpath = ["."]
addopts = "-q"
