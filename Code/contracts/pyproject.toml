[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claimclear-contracts"
version = "0.1.0"
description = "ClaimClear contracts shared by Member 2's tools and Member 3's agents: CaseState, hand-off messages, every tool's schemas, error codes, verdict labels and wording."
requires-python = ">=3.10"
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
validate = ["jsonschema>=4"]
dev = ["pytest>=8", "jsonschema>=4"]

[tool.setuptools]
packages = ["claimclear_contracts"]

[tool.setuptools.package-data]
claimclear_contracts = ["tool_schemas.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
