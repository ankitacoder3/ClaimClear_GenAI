[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claimclear-memory"
version = "0.1.0"
description = "ClaimClear long-term memory v1: per-user policy profile, verified claims, sub-limit balances and grievance status (SQLite, standard library only)."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
postgres = ["pg8000>=1.31"]      # CLAIMCLEAR_MEMORY_DB=postgresql://...
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["claimclear_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
