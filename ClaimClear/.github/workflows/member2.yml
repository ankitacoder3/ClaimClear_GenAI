# Member 2's suites: the MCP servers, the document reader, memory, contracts, the agents' toolkit.
# Member 4 takes this over and adds the app, the evaluation gate and the deployment jobs.
name: member2

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  # storage services (started below) for the production-backend tests
  CLAIMCLEAR_TEST_POSTGRES: postgresql://claimclear:claimclear@127.0.0.1:5432/claimclear
  CLAIMCLEAR_TEST_S3: s3://claimclear-test?endpoint=127.0.0.1:9000&secure=0
  CLAIMCLEAR_S3_ACCESS_KEY: claimclear
  CLAIMCLEAR_S3_SECRET_KEY: claimclear-secret

jobs:
  servers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: claimclear
          POSTGRES_PASSWORD: claimclear
          POSTGRES_DB: claimclear
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U claimclear -d claimclear" --health-interval 2s --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - name: MinIO (needs a command, so not a service container)
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=claimclear -e MINIO_ROOT_PASSWORD=claimclear-secret \
            cgr.dev/chainguard/minio@sha256:786cb11d340b1a657de8dc899560e36e1d1fb371d3d6f3eb6c903a0bb0cec714 server /data
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9000/minio/health/live && break; sleep 1; done

      - name: Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-servers.txt

      - name: Install the servers' environment
        run: python -m pip install -r requirements-servers.txt

      - name: Contracts are up to date with the servers
        working-directory: contracts
        run: python -m claimclear_contracts.export --check

      - name: settlement-engine
        working-directory: servers/settlement_engine
        run: python -m pytest -q -o addopts= -rs

      - name: document-reader (OCR tests run here)
        working-directory: servers/document_reader
        run: python -m pytest -q -o addopts= -rs

      - name: case-records (with PostgreSQL + MinIO)
        working-directory: servers/case_records
        run: python -m pytest -q -o addopts= -rs

      - name: policy-kb (with pgvector)
        working-directory: servers/policy_kb
        run: python -m pytest -q -o addopts= -rs

      - name: insurer-portal
        working-directory: servers/insurer_portal
        run: python -m pytest -q -o addopts= -rs

      - name: memory (SQLite and PostgreSQL)
        working-directory: memory
        run: python -m pytest -q -o addopts= -rs

      - name: contracts
        working-directory: contracts
        run: python -m pytest -q -o addopts= -rs

      - name: memory on vs off runner
        working-directory: development/dev_eval/memory_on_off
        run: python -m pytest -q -o addopts= -rs

      - name: dev-case extraction stand-in
        working-directory: development/dev_eval/dev_cases
        run: python -m pytest -q -o addopts= -rs

      - name: all five servers answer over HTTP
        env:
          CLAIMCLEAR_SERVER_PYTHON: python
        run: python scripts/dev_servers.py --check

  toolkit:
    # the agents' environment is separate: langchain-mcp-adapters needs mcp<2, the servers use mcp 2.3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Servers' environment (the toolkit's live tests start the servers with it)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-servers.txt
      - name: Agents' environment
        run: |
          python -m venv .venv-agents
          .venv-agents/bin/python -m pip install -r requirements-agents.txt
      - name: agents toolkit (live against every server)
        working-directory: agents/toolkit
        run: ../../.venv-agents/bin/python -m pytest -q -o addopts= -rs
