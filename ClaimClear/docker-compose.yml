# ClaimClear: `docker compose up --build`, then open http://localhost (the chat, UI2, on port 80).
# Put OPENROUTER_API_KEY in ClaimClear/.env first; it is read at run time, never built into the image.
services:
  claimclear:
    build: .
    image: claimclear:latest
    env_file:
      - path: .env
        required: false
    ports:
      - "80:8000"     # UI2, the chat, at http://localhost (8000 inside: the container runs without root)
    volumes:
      - claimclear-var:/app/var   # uploads, case store, logs (cleared on start unless CLAIMCLEAR_KEEP_DATA=1)
    restart: unless-stopped

volumes:
  claimclear-var:
