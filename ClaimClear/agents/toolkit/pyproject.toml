[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claimclear-tools"
version = "0.1.0"
description = "Agent-side helpers for the ClaimClear MCP servers: one toolkit for LangGraph agents, result parsing, routing signals, critic checks."
requires-python = ">=3.10"
dependencies = [
    "claimclear-contracts",          # ../../contracts: verdict wording, shared with the servers' side
    "langchain-mcp-adapters>=0.3,<0.4",
    "langchain-core>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["claimclear_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
