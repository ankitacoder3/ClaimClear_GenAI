[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claimclear-case-records"
version = "0.1.0"
description = "ClaimClear case-records MCP server: uploaded documents under neutral IDs, text with source spans and hidden-content flags, policy and claim history per case."
requires-python = ">=3.10"
dependencies = ["pymupdf>=1.24"]

[project.optional-dependencies]
server = ["mcp==2.3.0"]
postgres = ["pg8000>=1.31"]          # CLAIMCLEAR_CASE_INDEX=postgresql://...
s3 = ["minio>=7.2"]                   # CLAIMCLEAR_BLOB_STORE=s3://... (MinIO)
dev = ["pytest>=8", "mcp==2.3.0"]

[tool.setuptools]
packages = ["case_records"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore:'typing.ByteString':DeprecationWarning"]
