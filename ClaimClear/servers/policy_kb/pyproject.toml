[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claimclear-policy-kb"
version = "0.1.0"
description = "ClaimClear policy-wording knowledge base: clause ingestion, hybrid retrieval (BM25 + vectors + RRF + reranker), query rewriting, Recall@k evaluation, LangChain tools."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]
embeddings = ["fastembed>=0.4"]
pgvector = ["pg8000>=1.31"]       # CLAIMCLEAR_POLICY_KB_VECTORS=postgresql://... (pgvector extension)
tools = ["langchain-core>=1.3,<2"]
mcp = ["mcp==2.3.0"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["policy_kb", "policy_kb.mcp_server"]

[tool.setuptools.package-data]
policy_kb = ["rule_maps/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"
filterwarnings = ["ignore:'typing.ByteString':DeprecationWarning", "ignore::DeprecationWarning:langsmith.*"]
